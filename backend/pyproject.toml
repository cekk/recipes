[project]
name = "ricette-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.12.0",
    "python-telegram-bot>=21.0",
    "python-multipart>=0.0.9",
    "google-genai>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "google-auth>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
per-file-ignores = { "import_legacy.py" = ["E501"], "ai_service.py" = ["E501"] }
