name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ──────────────────────────────────────────
  backend-lint:
    name: 🐍 Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: "fake-key-for-ci"
      GITHUB_TOKEN_RECIPES: "fake-token-for-ci"
      GITHUB_REPO: "fake/repo"
      API_KEY: "fake-api-key"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync
      - name: Run pytest
        working-directory: backend
        run: uv run pytest -v

  # ─── Frontend ─────────────────────────────────────────
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
