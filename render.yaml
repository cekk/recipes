services:
  # Backend API (FastAPI)
  - type: web
    name: ricette-backend-cekk
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        value: "0"
      - key: BACKEND_URL
        value: https://ricette-backend-cekk.onrender.com

  # Frontend (Static React SPA)
  - type: web
    name: ricette-cekk
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      # URL del backend su Render — sostituisci con il tuo URL reale dopo il primo deploy
      - key: VITE_API_URL
        value: https://ricette-backend-cekk.onrender.com
      # Stesso Client ID configurato in Google Cloud Console
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      # SPA fallback: tutte le rotte servono index.html
      - type: rewrite
        source: /*
        destination: /index.html
